<div class="modal" id="vidModelModal" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-panel" role="dialog" aria-labelledby="vidModelTitle">
    <div class="modal-head">
      <div>
        <h2 id="vidModelTitle">เลือกโมเดลสร้างวิดีโอ</h2>
        <p class="muted small" id="vidModelCount">กำลังโหลด…</p>
      </div>
      <button class="icon-btn" type="button" data-close-modal aria-label="ปิด"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="picker-tools">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="vidModelSearch" placeholder="ค้นหา เช่น veo, seedance, wan, grok…" autocomplete="off">
      </div>
      <div class="picker-row">
        <div class="segmented" id="vidModelFilter">
          <button type="button" data-filter="all" class="active">ทั้งหมด</button>
          <button type="button" data-filter="audio">สร้างเสียงได้</button>
          <button type="button" data-filter="frame">ใส่ภาพเริ่มต้นได้</button>
        </div>
        <select class="input select sm" id="vidModelSort">
          <option value="popular">เรียง: ค่าเริ่มต้น</option>
          <option value="price_asc">ราคา: ต่ำ → สูง</option>
          <option value="price_desc">ราคา: สูง → ต่ำ</option>
          <option value="newest">ใหม่ล่าสุด</option>
          <option value="longest">คลิปยาวสุด</option>
          <option value="name">ชื่อ A → Z</option>
        </select>
        <select class="input select sm" id="vidProviderFilter"><option value="">ทุกผู้ให้บริการ</option></select>
      </div>
    </div>
    <div class="model-list-head"><span>โมเดล</span><span>ความยาว</span><span>ราคา <small>(ต่อวินาที, ตามที่ตั้งไว้)</small></span></div>
    <div class="model-list" id="vidModelList"><div class="empty">กำลังโหลดรายชื่อโมเดล…</div></div>
  </div>
</div>
