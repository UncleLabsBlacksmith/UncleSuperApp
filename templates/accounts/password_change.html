{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน · Uncle Super App{% endblock %}
{% block main %}
<header class="page-head">
  <button class="icon-btn only-mobile" data-open-sidebar aria-label="เมนู"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div><h1>เปลี่ยนรหัสผ่าน</h1><p class="muted">ตั้งรหัสผ่านใหม่สำหรับบัญชี {{ user.username }}</p></div>
</header>
<div class="page-body narrow">
  <form method="post" class="card form">
    {% csrf_token %}
    {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
    <div class="actions">
      <a href="{% url 'accounts:settings' %}" class="btn btn-ghost">ยกเลิก</a>
      <button class="btn btn-primary">บันทึกรหัสผ่าน</button>
    </div>
  </form>
</div>
{% endblock %}
