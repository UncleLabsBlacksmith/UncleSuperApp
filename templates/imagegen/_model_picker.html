<div class="modal" id="imgModelModal" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-panel" role="dialog" aria-labelledby="imgModelTitle">
    <div class="modal-head">
      <div>
        <h2 id="imgModelTitle">เลือกโมเดลสร้างภาพ</h2>
        <p class="muted small" id="imgModelCount">กำลังโหลด… (ครั้งแรกอาจใช้เวลาหลายวินาที)</p>
      </div>
      <button class="icon-btn" data-close-modal aria-label="ปิด"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="picker-tools">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="imgModelSearch" placeholder="ค้นหา เช่น flux, gemini, gpt-image, seedream…" autocomplete="off">
      </div>
      <div class="picker-row">
        <div class="segmented" id="imgModelFilter">
          <button type="button" data-filter="all" class="active">ทั้งหมด</button>
          <button type="button" data-filter="edit">รับภาพอ้างอิงได้</button>
          <button type="button" data-filter="free">ฟรี</button>
        </div>
        <select class="input select sm" id="imgModelSort">
          <option value="popular">เรียง: ค่าเริ่มต้น</option>
          <option value="price_asc">ราคา: ต่ำ → สูง</option>
          <option value="price_desc">ราคา: สูง → ต่ำ</option>
          <option value="newest">ใหม่ล่าสุด</option>
          <option value="name">ชื่อ A → Z</option>
        </select>
        <select class="input select sm" id="imgProviderFilter"><option value="">ทุกผู้ให้บริการ</option></select>
      </div>
    </div>
    <div class="model-list-head"><span>โมเดล</span><span>ภาพอ้างอิง</span><span>ราคา <small>(ต่อภาพ)</small></span></div>
    <div class="model-list" id="imgModelList"><div class="empty">กำลังโหลดรายชื่อโมเดล…</div></div>
  </div>
</div>
